<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NikeHub</title>
    <link id="site-favicon" rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/NoseyGames/data@main/favicon.png">
    
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Parkinsans:wght@600;700;800;900&display=swap");

        :root {
            --bg:#000000;
            --text:#e8e8e8;
            --gray-1:#c8c8c8;
            --gray-2:#888888;
            --gray-3:#444444;
            --glass:rgba(18,18,18,0.88);
            --border:rgba(255,255,255,0.09);
            --input-bg:rgba(28,28,28,0.75);
            --cell-bg:#161616;
            --hover:#282828;
            --gray-med: var(--gray-2);
            --text-white: var(--text);
        }

        *{box-sizing:border-box; margin:0; padding:0;}
        
        body {
            min-height: 100vh;
            margin:0;
            background:var(--bg);
            color:var(--text);
            font-family:"Parkinsans", sans-serif;
            font-weight:800;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas#constellation-canvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .sidebar {
            position:fixed;
            left:12px;
            top:12px;
            width:76px;
            height:calc(100vh - 24px);
            background:var(--glass);
            backdrop-filter:blur(12px);
            padding:14px;
            border-radius:10px;
            border:1px solid var(--border);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gear-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 24px;
            transition: transform 0.3s ease;
            outline: none;
        }

        .gear-btn:hover {
            transform: rotate(90deg);
            color: var(--gray-1);
        }

        .main-content {
            margin-left:110px;
            margin-right:300px;
            padding:28px 36px;
            width: calc(100% - 410px);
            flex: 1;
        }

        header { margin-bottom:24px; opacity:0; animation:fadeIn 1s forwards 0.3s; }
        @keyframes fadeIn{ to{opacity:1} }

        h1 { font-size:clamp(2.8rem, 6vw, 4.5rem); font-weight:900; letter-spacing:-2px; text-transform:uppercase; color:var(--text); line-height: 0.8; text-shadow:0 0 15px rgba(255,255,255,0.1); }
        .sub { font-size:12px; color:var(--gray-2); font-weight:700; text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; }
        .creator { font-size: 11px; color: var(--gray-1); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 6px; opacity: 0.8; }

        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1s forwards 0.6s;
        }

        .game-btn {
            background: var(--cell-bg);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 12px;
            color: var(--text);
            font-family: inherit;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            font-size: 0.85rem;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.7);
            white-space: nowrap;
        }

        .game-btn:hover { background: var(--hover); transform: translateY(-3px); border-color: var(--gray-1); filter: brightness(1.2); }

        .game-btn { position: relative; padding-right: 32px; }
        .fav-star {
            position: absolute; top: 4px; right: 8px; font-size: 0.95rem;
            opacity: .45; cursor: pointer; line-height: 1;
        }
        .fav-star:hover { opacity: 1; transform: scale(1.15); }
        .fav-star.active { opacity: 1; color: #ffd24d; }
        .chip-row { display: flex; gap: 6px; margin: 10px 0 6px; flex-wrap: wrap; }
        .chip {
            background: var(--cell-bg); border: 1px solid var(--border); color: var(--text);
            border-radius: 14px; padding: 6px 11px; font-size: 0.65rem; font-weight: 800;
            cursor: pointer; text-transform: uppercase; letter-spacing: .5px; font-family: inherit;
        }
        .chip:hover { background: var(--hover); }
        .chip.active { background: var(--hover); border-color: var(--text); }
        #gameCount { font-size: 0.65rem; opacity: .55; margin-bottom: 8px; letter-spacing: .5px; text-transform: uppercase; }
        .empty-state { opacity: .55; font-size: 0.85rem; padding: 30px 10px; text-align: center; width: 100%; grid-column: 1 / -1; }
        #cn-toast {
            position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 999000;
            background: rgba(20,20,20,.95); color: #fff; padding: 10px 14px; border-radius: 10px;
            font: 700 0.8rem system-ui, sans-serif; display: flex; gap: 10px; align-items: center;
            box-shadow: 0 6px 20px rgba(0,0,0,.45); max-width: 90vw;
        }
        #cn-toast button { border: 0; border-radius: 6px; cursor: pointer; font-weight: 800; padding: 4px 10px; font-size: 0.75rem; }
        #cn-toast .cn-retry { background: #2e9e55; color: #fff; }
        #cn-toast .cn-close { background: transparent; color: #999; padding: 4px 6px; }


        .search-sidebar {
            position:fixed;
            right:12px;
            top:12px;
            width:260px;
            height:calc(100vh - 24px);
            background:var(--glass);
            backdrop-filter:blur(12px);
            padding:14px;
            border-radius:10px;
            border:1px solid var(--border);
            display:flex;
            flex-direction:column;
            gap:10px;
            z-index: 10;
        }

        .search-input {
            background:var(--input-bg);
            color:var(--text);
            border:1px solid var(--border);
            border-radius:10px;
            padding:14px;
            font-family: inherit;
            font-weight: 700;
            outline: none;
        }

        .action-btn {
            background:var(--gray-3);
            color:var(--text);
            border:none;
            border-radius:10px;
            padding:12px;
            font-family: inherit;
            font-weight: 900;
            cursor:pointer;
            text-transform:uppercase;
            transition: 0.18s;
        }

        .action-btn:hover { background: var(--gray-2); transform: translateY(-2px); }

        /* Settings Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 14px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-content h3 {
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-group label {
            font-size: 0.8rem;
            color: var(--gray-1);
            text-transform: uppercase;
        }

        .setting-group input, .setting-group select {
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 700;
            outline: none;
        }

        .close-modal {
            background: var(--gray-3);
            color: var(--text);
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 900;
            margin-top: 10px;
        }

        .close-modal:hover { background: var(--gray-2); }

        .footer-credits {
            width: 100%;
            padding: 30px 0;
            text-align: center;
            font-family: "Parkinsans", sans-serif;
            font-size: 0.85rem;
            color: var(--gray-med);
            letter-spacing: 1px;
            z-index: 20;
            background: transparent;
        }
        .footer-credits a {
            color: var(--text-white);
            text-decoration: underline;
            text-underline-offset: 4px;
            font-weight: 700;
            margin-left: 5px;
            transition: 0.3s;
        }
        .footer-credits a:hover { color: #ffffff; opacity: 0.8; }

        @media (max-width:860px) {
            .main-content { margin-left:88px; margin-right: 12px; width: auto; }
            .search-sidebar { display: none; }
        }
    
        /* theme + console + overlay */
        .modal-overlay { z-index: 400 !important; }
        .modal-content { max-height: 90vh; overflow-y: auto; }
        .setting-group input[type=color] { height: 34px; padding: 2px; cursor: pointer; }
        .setting-group.row { flex-direction: row; align-items: center; justify-content: space-between; }
        .setting-group.row label { flex: 1; }
        .reset-btn { margin-top: 4px; }
        #consolePanel {
            display: none; position: fixed; left: 110px; right: 300px; bottom: 12px; height: 520px;
            flex-direction: column; gap: 8px; background: var(--glass); backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 10px; padding: 12px; z-index: 300;
        }
        .console-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .console-target { color: var(--gray-2); font-size: 11px; }
        #consoleOutput { flex: 1; overflow: auto; font-family: monospace; font-weight: 400; font-size: 12px; color: var(--text); background: var(--input-bg); border-radius: 8px; padding: 8px; min-height: 60px; white-space: pre-wrap; word-break: break-all; }
        #consoleInput { height: 90px; font-family: monospace; font-weight: 400; font-size: 13px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px; resize: vertical; outline: none; }
        .console-btns { display: flex; gap: 8px; }
        .console-btns .action-btn { padding: 8px 14px; }
        #gameOverlay { position: fixed; inset: 0; background: #000; z-index: 200; }
        #gameOverlay #nav-bar { position: absolute; top: 0; left: 0; right: 0; height: 40px; background: #111; display: flex; align-items: center; gap: 8px; padding: 0 15px; border-bottom: 1px solid #333; z-index: 2; }
        #gameOverlay #nav-bar button { color: #fff; border: 1px solid #444; border-radius: 4px; background: #222; padding: 4px 12px; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; font-family: inherit; }
        #gameOverlay #nav-bar button:hover { background: #333; border-color: #666; }
        #gameOverlay #execution-area { position: absolute; top: 40px; left: 0; width: 100%; height: calc(100% - 40px); border: none; }
        @media (max-width: 860px) { #consolePanel { left: 88px; right: 12px; } }

        #led { width: 22px; height: 22px; border-radius: 50%; margin-top: 12px; cursor: pointer; background: #333; border: 1px solid var(--border); transition: box-shadow 0.1s; }
        #led:hover { border-color: var(--gray-1); }
</style>

<body>

    <canvas id="constellation-canvas"></canvas>

    <div class="sidebar">
        <button class="gear-btn" onclick="toggleSettings()" title="Settings">⚙️</button>
        <button class="gear-btn" onclick="toggleConsole()" title="Console">⌨</button>
        <div id="led" title="Click for rainbow mode" onclick="toggleRainbow()"></div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <h3>Settings</h3>
            <div class="setting-group">
                <label for="textColorPicker">Front / Text Color</label>
                <input type="color" id="textColorPicker" value="#e8e8e8" onchange="changeTheme('text', this.value)">
            </div>
            <div class="setting-group">
                <label for="graphicsSelect">Graphics Profile</label>
                <select id="graphicsSelect" onchange="updateGraphics(this.value)">
                    <option value="4k">4K Ultra (High Stars)</option>
                    <option value="balanced">Balanced (Normal)</option>
                    <option value="performance">Performance (Low Stars / Off)</option>
                </select>
            </div>
            <div class="setting-group">
                <label for="tabCloakSelect">Tab Cloak (Fox / Custom)</label>
                <select id="tabCloakSelect" onchange="updateTabCloak(this.value)">
                    <option value="nikehub">NikeHub</option>
                    <option value="google">Google</option>
                    <option value="classroom">Google Classroom</option>
                    <option value="drive">Google Drive</option>
                </select>
            </div>
            <div class="setting-group"><label>Background</label><input type="color" id="bgPicker" onchange="changeTheme('bg', this.value)"></div>
            <div class="setting-group"><label>Panels</label><input type="color" id="panelPicker" onchange="changeTheme('panel', this.value)"></div>
            <div class="setting-group"><label>Button Fill</label><input type="color" id="btnPicker" onchange="changeTheme('btn', this.value)"></div>
            <div class="setting-group"><label>Button Hover</label><input type="color" id="hoverPicker" onchange="changeTheme('hover', this.value)"></div>
            <div class="setting-group"><label>Action Buttons</label><input type="color" id="actionPicker" onchange="changeTheme('action', this.value)"></div>
            <div class="setting-group"><label>Stars</label><input type="color" id="starPicker" onchange="changeTheme('stars', this.value)"></div>
            <button class="action-btn reset-btn" onclick="resetTheme()">Reset Colors</button>
            <button class="close-modal" onclick="toggleSettings()">Close</button>
        </div>
    </div>

    <div class="search-sidebar">
        <input class="search-input" id="searchBox" placeholder="SEARCH NIKEHUB..." oninput="filterGames()">
        <div class="chip-row" id="filterChips">
            <button class="chip active" data-mode="all" onclick="setFilterMode('all')">All</button>
            <button class="chip" data-mode="favorites" onclick="setFilterMode('favorites')">&#9733; Favorites</button>
            <button class="chip" data-mode="recent" onclick="setFilterMode('recent')">&#9201; Recent</button>
        </div>
        <div id="gameCount"></div>
        <button class="action-btn" onclick="randomGame()">&#127922; Random Game</button>
        <button class="action-btn" onclick="disguise()">Disguise Tab</button>
        <button class="action-btn" onclick="window.location.href='https://google.com'">Instant Exit</button>
    </div>

    <div class="main-content">
        <header>
            <h1>nikehub</h1>
            <div class="sub">made by carson</div>
            <div class="creator">Made by Iain</div>
        </header>
        <div class="buttons-container" id="game-list"></div>
    </div>

    <div class="modal-overlay" id="devModal">
        <div class="modal-content">
            <h3>Dev Menu</h3>
            <div class="setting-group">
                <label>Console password</label>
                <input type="password" id="devPw" class="search-input" placeholder="NEW PASSWORD">
            </div>
            <button class="action-btn" onclick="devSetPassword()">Set Password</button>
            <button class="action-btn" onclick="devResetPassword()">Use Default (1379)</button>
            <button class="action-btn" onclick="devResetColors()">Reset Colors</button>
            <div id="devMsg" style="font-size:12px;min-height:14px;"></div>
            <button class="close-modal" onclick="closeDevMenu()">Close</button>
        </div>
    </div>

    <div class="modal-overlay" id="lockModal">
        <div class="modal-content">
            <h3>Console Locked</h3>
            <input type="password" id="lockInput" class="search-input" placeholder="PASSWORD" onkeydown="if (event.key === 'Enter') tryUnlock()">
            <div id="lockMsg" style="font-size:12px;color:#ff6b6b;min-height:14px;"></div>
            <button class="action-btn" onclick="tryUnlock()">Unlock</button>
            <button class="close-modal" onclick="hideLock()">Cancel</button>
        </div>
    </div>

    <div id="consolePanel">
        <div class="console-head"><span>Console</span><select id="gamePick" onchange="pickGame(this.value)"><option value="">Load game…</option><option value="clretrobowl">Retro Bowl</option><option value="clcookieclicker">Cookie Clicker</option></select><select id="consoleMode" onchange="setConsoleMode(this.value)"><option value="js">JavaScript</option><option value="html">HTML</option></select><span class="console-target" id="consoleTarget">target: NikeHub</span><button class="close-modal" style="margin:0;padding:4px 10px" onclick="toggleConsole()">×</button></div>
        <div id="gameTools" style="display:none;gap:8px;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:1px;">
            <span>Cookies</span>
            <input type="number" id="ccAmount" min="0" class="search-input" style="width:180px;padding:8px 10px;" placeholder="amount" onkeydown="if (event.key === 'Enter') setCookieClickerCookies()">
            <button class="action-btn" onclick="setCookieClickerCookies()">Set cookies</button>
        </div>
        <div id="rbTools" style="display:none;flex-direction:column;gap:6px;font-size:12px;">
            <div style="display:flex;gap:8px;align-items:center;">
                <select id="rbPlayer" onchange="rbLoadPlayer()" style="flex:1;min-width:0;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-family:monospace;font-size:11px;"></select>
                <button class="action-btn" onclick="rbRefreshPlayers()">Refresh</button>
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                <span>Speed</span><input type="number" id="rbSpeed" min="0" max="99" class="search-input" style="width:70px;padding:8px 10px;">
                <span>Strength</span><input type="number" id="rbStrength" min="0" max="99" class="search-input" style="width:70px;padding:8px 10px;">
                <span>Stamina</span><input type="number" id="rbStamina" min="0" max="99" class="search-input" style="width:70px;padding:8px 10px;">
                <span>Skill</span><input type="number" id="rbSkill" min="0" max="99" class="search-input" style="width:70px;padding:8px 10px;">
                <button class="action-btn" onclick="rbApplyPlayer()">Apply</button>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <span>CC</span>
                <input type="number" id="rbCC" min="0" class="search-input" style="width:170px;padding:8px 10px;" placeholder="coach credits" onkeydown="if (event.key === 'Enter') rbSetCC()">
                <button class="action-btn" onclick="rbSetCC()">Set CC</button>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <span>Find</span>
                <input type="number" id="rbFind" class="search-input" style="width:130px;padding:8px 10px;" placeholder="number on screen" onkeydown="if (event.key === 'Enter') rbFind(false)">
                <button class="action-btn" onclick="rbFind(false)">Find</button>
                <button class="action-btn" onclick="rbFind(true)">Narrow</button>
                <button class="action-btn" onclick="rbReset()">Reset</button>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
                <select id="rbCands" style="flex:1;min-width:0;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-family:monospace;font-size:11px;"></select>
                <input type="number" id="rbSet" class="search-input" style="width:130px;padding:8px 10px;" placeholder="new number">
                <button class="action-btn" onclick="rbSetSelected()">Set</button>
            </div>
        </div>
        <div id="consoleOutput"></div>
        <textarea id="consoleInput" spellcheck="false" placeholder="JavaScript to run. Ctrl+Enter to run. Runs inside the open game if one is open, otherwise on NikeHub." onkeydown="consoleKey(event)"></textarea>
        <div class="console-btns"><button id="runBtn" class="action-btn" onclick="runConsole()">Run</button><div id="htmlBtns" style="display:none;gap:8px"><button class="action-btn" onclick="loadBodyHTML()">Load page HTML</button><button class="action-btn" onclick="insertHTML(false)">Append</button><button class="action-btn" onclick="insertHTML(true)">Replace body</button></div><button class="action-btn" onclick="document.getElementById('consoleOutput').innerHTML=''">Clear</button></div>
    </div>

    <div class="footer-credits">
        NikeNetwork by Iain | <a href="https://nikehub.org" target="_blank">-> not working!! <-</a>
    </div>

    <script>
        const canvas = document.getElementById('constellation-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let starCount = 125;
        const maxDistance = 150;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        let starRGB = '255, 255, 255';

        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 1.8;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${starRGB}, 0.7)`;
                ctx.fill();
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) stars.push(new Star());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => { s.update(); s.draw(); });
            for (let i = 0; i < stars.length; i++) {
                for (let j = i + 1; j < stars.length; j++) {
                    const dx = stars[i].x - stars[j].x;
                    const dy = stars[i].y - stars[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDistance) {
                        const alpha = 1 - (dist / maxDistance);
                        ctx.beginPath();
                        ctx.moveTo(stars[i].x, stars[i].y);
                        ctx.lineTo(stars[j].x, stars[j].y);
                        ctx.strokeStyle = `rgba(${starRGB}, ${alpha * 0.4})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize(); initStars(); animate();

        // Settings Modal Controls
        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function updateTextColor(color) {
            document.documentElement.style.setProperty('--text', color);
            document.documentElement.style.setProperty('--gray-1', color);
        }

        function updateGraphics(profile) {
            if (profile === '4k') {
                starCount = 250;
            } else if (profile === 'balanced') {
                starCount = 125;

        const RETROBOWL_URL = "https://cdn.jsdelivr.net/gh/iaingaines31-afk/nike-hub-api@main/retrobowl.txt";

        async function loadEmbeddedRetroBowl() {
            const res = await fetch(RETROBOWL_URL + '?t=' + Date.now());
            if (!res.ok) throw new Error('retrobowl.txt not found in your repo (HTTP ' + res.status + ')');
            const base64 = (await res.text()).trim().split(',')[1];
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const zip = await JSZip.loadAsync(bytes);
            const htmlName = Object.keys(zip.files).find(n => n.endsWith('.html') || n.endsWith('.htm'));
            if (!htmlName) throw new Error('No HTML file found in retro bowl archive');
            return await zip.files[htmlName].async('string');
        }

        // ---- Safe storage (falls back to memory-only if localStorage is blocked) ----
        let memStore = {};
        function storageGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return Object.prototype.hasOwnProperty.call(memStore, key) ? memStore[key] : null; }
        }
        function storageSet(key, value) {
            memStore[key] = value;
            try { localStorage.setItem(key, value); } catch (e) { /* session-only on this page */ }
        }

        // ---- Favorites ----
        let favorites = new Set();
        try { favorites = new Set(JSON.parse(storageGet('nikehub-favorites') || '[]')); } catch (e) {}
        function isFavorite(file) { return favorites.has(file); }
        function toggleFavorite(file) {
            if (favorites.has(file)) favorites.delete(file); else favorites.add(file);
            storageSet('nikehub-favorites', JSON.stringify([...favorites]));
            filterGames();
        }

        // ---- Recently played ----
        const RECENT_MAX = 12;
        let recent = [];
        try { recent = JSON.parse(storageGet('nikehub-recent') || '[]'); } catch (e) {}
        function addRecent(file) {
            recent = [file, ...recent.filter(f => f !== file)].slice(0, RECENT_MAX);
            storageSet('nikehub-recent', JSON.stringify(recent));
            if (filterMode === 'recent') filterGames();
        }

        // ---- Filter mode (All / Favorites / Recent) ----
        let filterMode = 'all';
        function setFilterMode(mode) {
            filterMode = mode;
            document.querySelectorAll('#filterChips .chip').forEach(c => c.classList.toggle('active', c.dataset.mode === mode));
            filterGames();
        }
        function baseList() {
            if (filterMode === 'favorites') return files.filter(isFavorite);
            if (filterMode === 'recent') return recent.filter(f => files.includes(f));
            return files;
        }

        // ---- Toast (loading / error+retry, replaces alert()) ----
        function toast(opts) {
            let box = document.getElementById('cn-toast');
            if (!box) { box = document.createElement('div'); box.id = 'cn-toast'; document.body.appendChild(box); }
            box.innerHTML = '';
            const span = document.createElement('span'); span.textContent = opts.text || '';
            box.appendChild(span);
            if (opts.retry) {
                const r = document.createElement('button'); r.className = 'cn-retry'; r.textContent = 'Retry';
                r.onclick = () => { box.remove(); opts.retry(); };
                box.appendChild(r);
            }
            const x = document.createElement('button'); x.className = 'cn-close'; x.textContent = '\u2715';
            x.onclick = () => box.remove();
            box.appendChild(x);
            return box;
        }

        function renderGames(list) {
            const container = document.getElementById("game-list");
            if (!container) return;
            container.innerHTML = '';
            if (!list.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = filterMode === 'favorites' ? 'No favorites yet \u2014 click the star on a game to add one.'
                    : filterMode === 'recent' ? 'Nothing played yet.'
                    : 'No games match your search.';
                container.appendChild(empty);
                return;
            }
            list.forEach(file => {
                const btn = document.createElement('button');
                btn.className = 'game-btn';
                const label = document.createElement('span');
                label.textContent = file.replace(/^cl/i, '');
                const star = document.createElement('span');
                star.className = 'fav-star' + (isFavorite(file) ? ' active' : '');
                star.textContent = isFavorite(file) ? '\u2605' : '\u2606';
                star.title = 'Favorite';
                star.onclick = (e) => { e.stopPropagation(); toggleFavorite(file); };
                btn.appendChild(label);
                btn.appendChild(star);
                btn.onclick = () => launchGame(file);
                container.appendChild(btn);
            });
        }

        function updateGameCount(shown) {
            const el = document.getElementById('gameCount');
            if (el) el.textContent = shown + ' / ' + files.length + ' games';
        }

        function randomGame() {
            const pool = filterMode === 'favorites' ? files.filter(isFavorite) : files;
            const list = pool.length ? pool : files;
            if (!list.length) return;
            launchGame(list[Math.floor(Math.random() * list.length)]);
        }

        // ---- Keyboard shortcuts: "/" focuses search, Esc closes overlay/modals ----
        document.addEventListener('keydown', (e) => {
            const tag = (document.activeElement && document.activeElement.tagName) || '';
            const typing = tag === 'INPUT' || tag === 'TEXTAREA';
            if (e.key === '/' && !typing) {
                e.preventDefault();
                const sb = document.getElementById('searchBox');
                if (sb) sb.focus();
            } else if (e.key === 'Escape') {
                if (overlayOpen) { closeOverlay(); return; }
                ['settingsModal', 'devModal', 'lockModal'].forEach(id => {
                    const m = document.getElementById(id);
                    if (m && getComputedStyle(m).display !== 'none') m.style.display = 'none';
                });
                const cp = document.getElementById('consolePanel');
                if (cp && getComputedStyle(cp).display !== 'none') cp.style.display = 'none';
            }
        });

        function decodeEmbeddedB64(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        }

        // ---- Theme ----
        const themeDefaults = { bg:'#000000', text:'#e8e8e8', panel:'#121212', btn:'#161616', hover:'#282828', action:'#444444', stars:'#ffffff' };
        let theme = Object.assign({}, themeDefaults);
        function setStarColor(hex) {
            const n = parseInt(hex.slice(1), 16);
            starRGB = ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255);
        }
        function applyTheme(t) {
            const root = document.documentElement.style;
            root.setProperty('--bg', t.bg);
            root.setProperty('--text', t.text);
            root.setProperty('--gray-1', t.text);
            root.setProperty('--glass', t.panel);
            root.setProperty('--cell-bg', t.btn);
            root.setProperty('--hover', t.hover);
            root.setProperty('--gray-3', t.action);
            setStarColor(t.stars);
        }
        function syncPickers() {
            const map = { textColorPicker:'text', bgPicker:'bg', panelPicker:'panel', btnPicker:'btn', hoverPicker:'hover', actionPicker:'action', starPicker:'stars' };
            for (const id in map) document.getElementById(id).value = theme[map[id]];
        }
        function saveTheme() { try { localStorage.setItem('nikehub-theme', JSON.stringify(theme)); } catch (e) {} }
        function loadTheme() {
            try { theme = Object.assign({}, themeDefaults, JSON.parse(localStorage.getItem('nikehub-theme') || '{}')); }
            catch (e) { theme = Object.assign({}, themeDefaults); }
            applyTheme(theme);
            syncPickers();
        }
        function changeTheme(key, val) { theme[key] = val; applyTheme(theme); saveTheme(); }
        function resetTheme() { theme = Object.assign({}, themeDefaults); applyTheme(theme); syncPickers(); saveTheme(); }

        // ---- Console ----
        function currentTarget() {
            const frame = document.getElementById('execution-area');
            if (overlayOpen && frame && frame.contentWindow) return { win: frame.contentWindow, name: 'game' };
            return { win: window, name: 'NikeHub' };
        }
        function toggleConsole() {
            const p = document.getElementById('consolePanel');
            const open = p.style.display !== 'flex';
            if (open && !consoleUnlocked) { showLock(); return; }
            p.style.display = open ? 'flex' : 'none';
            updateGameTools();
            document.getElementById('consoleTarget').textContent = 'target: ' + currentTarget().name;
            if (open) document.getElementById('consoleInput').focus();
        }
        function consoleLog(msg, isErr) {
            const out = document.getElementById('consoleOutput');
            const d = document.createElement('div');
            d.textContent = msg;
            if (isErr) d.style.color = '#ff6b6b';
            out.appendChild(d);
            out.scrollTop = out.scrollHeight;
        }
        function formatResult(r) {
            if (typeof r === 'object' && r !== null) { try { return JSON.stringify(r); } catch (e) {} }
            return String(r);
        }
        function runConsole() {
            const code = document.getElementById('consoleInput').value;
            if (!code.trim()) return;
            const t = currentTarget();
            document.getElementById('consoleTarget').textContent = 'target: ' + t.name;
            consoleLog('[' + t.name + '] > ' + code);
            try {
                const result = t.win.eval(code);
                if (result !== undefined) consoleLog(formatResult(result));
            } catch (e) {
                consoleLog(String((e && e.message) || e), true);
            }
        }
        function consoleKey(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runConsole(); }
        }

        // ---- Game overlay (stays on this page, so settings and console keep working) ----
        let overlayOpen = false;
        function closeOverlay() {
            const ov = document.getElementById('gameOverlay');
            if (ov) ov.remove();
            overlayOpen = false;
            rbCandidates = [];
            rbRefreshList();
            updateGameTools();
            document.getElementById('consoleTarget').textContent = 'target: NikeHub';
        }
        function openOverlay(html) {
            closeOverlay();
            const ov = document.createElement('div');
            ov.id = 'gameOverlay';
            ov.innerHTML = '<div id="nav-bar"><button id="back-btn">← back</button><button id="ov-console">⌨ console</button><button id="ov-settings">⚙ settings</button></div>';
            const frame = document.createElement('iframe');
            frame.id = 'execution-area';
            ov.appendChild(frame);
            document.body.appendChild(ov);
            ov.querySelector('#back-btn').onclick = closeOverlay;
            ov.querySelector('#ov-console').onclick = toggleConsole;
            ov.querySelector('#ov-settings').onclick = toggleSettings;
            overlayOpen = true;
            updateGameTools();
            const doc = frame.contentDocument;
            doc.open();
            doc.write(html);
            doc.close();
        }

        async function launchGame(file) {
            const label = file.replace(/^cl/i, '');
            const loadingToast = toast({ text: 'Loading ' + label + '\u2026' });
            try {
                let rawGameCode;
                if (file === 'clkrillion') {
                    rawGameCode = decodeEmbeddedB64(EMBEDDED_KRILLION_B64);
                } else if (file === 'clretrobowl') {
                    rawGameCode = await loadEmbeddedRetroBowl();
                } else {
                    const normalized = file.endsWith('.html') ? file : file + '.html';
                    const url = `https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/${encodeURIComponent(normalized)}`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("Fetch failed");
                    rawGameCode = await response.text();
                    const baseTag = `<base href="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/">`;
                    rawGameCode = rawGameCode.includes('<head>') ? rawGameCode.replace('<head>', '<head>' + baseTag) : baseTag + rawGameCode;
                }
                currentGameFile = file;
                addRecent(file);
                loadingToast.remove();
                openOverlay(rawGameCode);
            } catch (err) {
                loadingToast.remove();
                toast({ text: 'Could not load ' + label + ': ' + err.message, retry: () => launchGame(file) });
            }
        }

        function filterGames() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            let list = baseList();
            if (query) list = list.filter(f => f.toLowerCase().includes(query));
            if (filterMode === 'all') {
                const favs = list.filter(isFavorite);
                const rest = list.filter(f => !isFavorite(f));
                list = favs.concat(rest);
            }
            renderGames(list);
            updateGameCount(list.length);
        }

            document.getElementById('settingsModal').style.display = 'flex';
            const sel = document.getElementById('tabCloakSelect');

        }

                    var t2 = (S0 + maj) >>> 0;
                    h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
                }
                H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
                H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;

<script>

      var r = await fetch('https://api.github.com/repos/' + U + '/' + R + '/contents/' + FOLDER + '?ref=' + encodeURIComponent(REF), { cache: 'no-store' });
      if (r.ok) list = (await r.json()).filter(function (f) { return f.type === 'file'; }).map(function (f) { return f.name; });
    } catch (e) {}

      var r2 = await fetch('https://data.jsdelivr.com/v1/packages/gh/' + U + '/' + R + '@' + REF + '?structure=flat', { cache: 'no-store' });
      if (r2.ok) list = (await r2.json()).files.map(function (f) { return f.name; })
        .filter(function (n) { return n.indexOf('/' + FOLDER + '/') === 0 && n.split('/').length === 3; })
        .map(function (n) { return n.slice(FOLDER.length + 2); });
    } catch (e) {} }
    if (!list) { try { return JSON.parse(localStorage.getItem('nh-mine-last') || '[]'); } catch (e) { return []; } } // 3) last known list
    try { sessionStorage.setItem('nh-mine-list', JSON.stringify({ t: Date.now(), l: list })); localStorage.setItem('nh-mine-last', JSON.stringify(list)); } catch (e) {}
    return list;
  }

  // open games from the games folder (everything else goes to the normal loader)

      try { addRecent(file); } catch (e) {}
      t.remove(); openOverlay(code);
    } catch (e) { t.remove(); toast({ text: 'Could not load ' + label + ': ' + e.message, retry: function () { window.launchGame(file); } }); }
  };

  (async function () {
    try {
      var names = (await listGames()).filter(function (n) { return /\.html?$/i.test(n); }), ids = [];

    var rn=inp('nh-rn','Game name'),rl=inp('nh-rl','Link to the game (optional)'),rt=inp('nh-rt','Note (optional)');[rn,rl,rt].forEach(sty);
    var msg=el('div','');msg.style.cssText='min-height:18px;font-size:12px;margin:6px 0;color:#9fd2ff';
    function build(){var n=rn.value.trim();if(!n){msg.textContent='Type the game name first.';return null}
      var today3=localReqs().filter(function(q){return q.u===u&&Date.now()-q.t<864e5}).length;
      if(today3>=3){msg.textContent='You can send 3 requests per day. Try again tomorrow.';return null}
      return {u:u,name:n,link:rl.value.trim(),note:rt.value.trim(),t:Date.now()}}
    function text(q){return 'Requested by: '+q.u+'\nLink: '+(q.link||'-')+'\nNote: '+(q.note||'-')}
    function save(q){try{var l=localReqs();l.push(q);localStorage.setItem('nikehub-requests',JSON.stringify(l.slice(-50)))}catch(e){}}
    var b1=el('button','Send request (opens GitHub)',function(){var q=build();if(!q)return;save(q);
      window.open('https://github.com/'+GH.u+'/'+GH.r+'/issues/new?title='+encodeURIComponent('[Game request] '+q.name)+'&body='+encodeURIComponent(text(q)),'_blank','noopener');
      msg.textContent='GitHub opened. Press "Submit new issue" there so Iain gets it (free GitHub account needed).'});
    var b2=el('button','Copy request text',function(){var q=build();if(!q)return;save(q);
      try{navigator.clipboard.writeText('[Game request] '+q.name+'\n'+text(q));msg.textContent='Copied. Send it to Iain.'}catch(e){msg.textContent='Could not copy.'}});
    var b3=el('button','Close',function(){o.style.display='none'});[b1,b2,b3].forEach(sty);
    bx.append(el('h3','\uD83C\uDFAE Request a game'),rn,rl,rt,msg,b1,b2,b3);o.append(bx)}
  // add buttons to the floating tools column
  function addTool(label,fn,id){var tl=$('nh-tools'),b=el('button',label,fn,id);
    if(tl)tl.insertBefore(b,tl.firstChild);else{b.style.cssText='position:fixed;right:14px;bottom:'+(60+document.querySelectorAll('.nh-tool').length*46)+'px;z-index:9999;padding:10px 14px;background:rgba(18,18,18,.88);color:#e8e8e8;border:1px solid rgba(255,255,255,.09);border-radius:10px;font:800 13px Parkinsans,sans-serif;cursor:pointer';b.className='nh-tool';document.body.append(b)}}
  addTool('\uD83C\uDFAE Request a game',openReq,'nh-reqbtn');addTool('\uD83C\uDD95 New releases',showReleases,'nh-new');
  // put the buttons in the sidebar, right under Instant Exit
  (function(){var sb=document.querySelector('.search-sidebar');if(!sb)return;
    ['nh-reqbtn','nh-new','nh-data','nh-full'].forEach(function(id){var b=$(id);if(b){b.className='action-btn';b.style.cssText='';sb.appendChild(b)}});
    var r=$('nh-rand');if(r)r.style.display='none'})();
  // ---- gate: games ----
  var origLaunch=window.launchGame;
  window.launchGame=function(file){
    var a=ld()[me()];
    if(!a){mode='in';return openAcc('Sign in to play. Free accounts get '+PLANS.free.games+' games a month.')}
    var P=PLANS[planOf(a)],R0=NEW_RELEASES[file]?relOf(file):null;
    if(R0&&Date.now()<availAt(R0.date,P.wait).getTime())return showWait(file,R0.date,planOf(a),R0.cover);
    if(left(a,'games')<=0)return openAcc('You used all '+P.games+' games this month. Upgrade your plan or wait for next month. '+PAY_MSG);
    use('games');
    return origLaunch.apply(this,arguments);
  };
  // ---- gate: console ----
  var orig=window.toggleConsole,gate={dev:function(){orig()}};
  window.toggleConsole=function(){
    var pn=$('consolePanel'),open=pn&&pn.style.display==='flex';
    if(open){var r=orig.apply(this,arguments);if(viaPlan){try{consoleUnlocked=false}catch(e){}viaPlan=false}return r}
    if(viaPlan){try{consoleUnlocked=false}catch(e){}viaPlan=false}
    if(devOK())return orig.apply(this,arguments);
    var a=ld()[me()];
    if(!a){mode='in';return openAcc('Sign in to use the console.')}
    var P=PLANS[planOf(a)];
    if(!P.console)return openAcc('The console needs the Pro plan or higher. '+PAY_MSG);
    if(left(a,'console')<=0)return openAcc('You used all '+P.console+' console uses this month. '+PAY_MSG);
    use('console');viaPlan=true;try{consoleUnlocked=true}catch(e){}
    return orig.apply(this,arguments);
  };
  // ---- dev menu: plans ----
  var dm=document.querySelector('#devModal .modal-content'),anchor=$('devMsg');
  if(dm&&anchor){
    var w=document.createElement('div'),opts=Object.keys(PLANS).map(function(k){return '<option value="'+k+'">'+PLANS[k].label+'</option>'}).join('');
    w.innerHTML='<label>My plan (this account)</label><select id="nh-my">'+opts+'</select><label>Plans for other people</label><input id="nh-du" class="search-input" placeholder="USERNAME"><select id="nh-dp">'+opts+'</select><input id="nh-ds" type="date" title="Start date (leave blank for today)"><button id="nh-dk" class="action-btn">Create signing key (once)</button><button id="nh-dc" class="action-btn">Make plan code (1 month) </button><label>New games</label><input id="nh-dg" class="search-input" placeholder="GAME ID (e.g. wilywars)"><input id="nh-dr" type="date" title="Release date (blank = today)"><button id="nh-dw" class="action-btn">Preview wait screen (uses the plan chosen above)</button><button id="nh-dl" class="action-btn">Make NEW_RELEASES line</button><div id="nh-dout" style="font-size:12px;word-break:break-all;min-height:14px"></div><div id="nh-dlist"></div><label>Game requests (refreshes every 60 seconds)</label><div id="nh-rqs" style="font-size:12px;color:#aaa"></div><button id="nh-rqb" class="action-btn">Refresh now</button><div id="nh-rq"></div>';
    dm.insertBefore(w,anchor);
    $('nh-dk').onclick=async function(){var o=$('nh-dout');try{
      if(localStorage.getItem('nikehub-dev-key')&&!confirm('A key already exists. Replace it? Old codes will stop working.'))return;
      var kp=await crypto.subtle.generateKey(ALG,true,['sign','verify']);
      localStorage.setItem('nikehub-dev-key',JSON.stringify(await crypto.subtle.exportKey('jwk',kp.privateKey)));
      o.textContent='Public key (paste between the quotes of DEV_PUBKEY in nikehub350.html, then re-upload): '+JSON.stringify(await crypto.subtle.exportKey('jwk',kp.publicKey))}catch(e){o.textContent='Error: '+e.message}};
    $('nh-dc').onclick=async function(){var u=$('nh-du').value.trim().toLowerCase(),o=$('nh-dout');if(!u){o.textContent='';return}
      var st=$('nh-ds').value||today(),c=await makePlan(u,$('nh-dp').value,st);o.textContent=c?('Plan code for '+u+' ('+$('nh-dp').value+', '+st+' to '+addMonth(st)+'): '+c):'Create a signing key first.'};
    $('nh-my').onchange=function(){var x=ld(),u=me();if(!x[u]){$('nh-dout').textContent='Sign in first (top of the page), then pick your plan.';return}
      x[u].plan=$('nh-my').value;x[u].planStart='';x[u].planExp='';sv(x);chip()};
    $('nh-dl').onclick=function(){var g=$('nh-dg').value.trim(),r=$('nh-dr').value||today();$('nh-dout').textContent=g?("Paste inside NEW_RELEASES in nikehub350.html: '"+g+"':'"+r+"',"):'Type a game id first.'};
    $('nh-dw').onclick=function(){var g=$('nh-dg').value.trim()||'example game',k=$('nh-dp').value;
      if(!PLANS[k].wait)return $('nh-dout').textContent='That plan has no wait. Pick Free, Pro or Master in the plan list above.';
      showWait(g,$('nh-dr').value||today(),k)};
    var wasVis=false,reqErr='';
    async function refreshReq(){
      var out=[];reqErr='';
      try{var r=await fetch('https://api.github.com/repos/'+GH.u+'/'+GH.r+'/issues?state=open&per_page=100',{cache:'no-store'});
        if(r.ok)(await r.json()).forEach(function(i){if(!i.pull_request&&/^\[game request\]/i.test(i.title))out.push({name:i.title.replace(/^\[game request\]\s*/i,''),body:i.body||'',date:(i.created_at||'').slice(0,10),url:i.html_url,src:'GitHub'})});
        else reqErr='GitHub answered '+r.status+' (try again soon)'}catch(e){reqErr=e.message}
      localReqs().forEach(function(q){out.push({name:q.name,body:'By '+q.u+(q.link?' \u2014 '+q.link:'')+(q.note?' \u2014 '+q.note:''),date:new Date(q.t).toISOString().slice(0,10),url:'',src:'this browser'})});
      out.sort(function(x,y){return x.date<y.date?1:-1});
      var L=$('nh-rq');L.textContent='';
      $('nh-rqs').textContent='Updated '+new Date().toLocaleTimeString()+' \u2014 '+out.length+' request'+(out.length===1?'':'s')+(reqErr?' \u2014 '+reqErr:'');
      out.forEach(function(q){var d=el('div');d.style.cssText='margin:6px 0;padding:8px;border:1px solid rgba(255,255,255,.12);border-radius:8px;font-size:12px;word-break:break-word';
        var b=el('b',q.name);d.append(b,el('div',q.date+' \u00B7 '+q.src),el('div',q.body.slice(0,160)));
        if(/^https:\/\/github\.com\//.test(q.url)){var al=document.createElement('a');al.href=q.url;al.target='_blank';al.rel='noopener';al.textContent='Open on GitHub';al.style.color='#9fd2ff';d.append(al)}
        L.append(d)})}
    $('nh-rqb').onclick=refreshReq;
    setInterval(function(){if(wasVis)refreshReq()},60000);
    var last='';
    setInterval(function(){
      if($('devModal').style.display==='none'||!$('devModal').offsetParent){wasVis=false;return}
      if(!wasVis){wasVis=true;refreshReq()}
      var my=$('nh-my'),a0=ld()[me()];if(my&&document.activeElement!==my){my.value=a0?planOf(a0):'free';my.disabled=!a0}
      var all=ld(),sig=JSON.stringify(all);if(sig===last)return;last=sig;
      var L=$('nh-dlist');L.textContent='';
      Object.keys(all).forEach(function(n){var a=all[n],us=a.usage&&a.usage.m===mk()?a.usage:{games:0,console:0},P=PLANS[planOf(a)];
        L.append(ln(n+' \u2014 '+P.label+(a.planExp?' ['+a.planStart+' to '+a.planExp+']':'')+' \u2014 games '+us.games+'/'+(P.games===Infinity?'\u221E':P.games)+', console '+us.console+'/'+(P.console===Infinity?'\u221E':P.console)));
        var s=document.createElement('select');s.innerHTML=opts;s.value=planOf(a);
        s.onchange=function(){var x=ld();x[n].plan=s.value;x[n].planStart='';x[n].planExp='';sv(x)};L.append(s)});
    },1000);
  }
})();
</script>
