<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NikeHub</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#000;color:#e8e8e8;font-family:system-ui,sans-serif}
  #status{white-space:pre-line;text-align:center;opacity:.85;line-height:1.6;padding:20px}
</style>
</head>
<body>
<div id="status">Loading...</div>

<script>
// ===== Your hosted files (GitHub repo -> jsDelivr) =====
const BASE   = "https://cdn.jsdelivr.net/gh/iaingaines31-afk/nike-hub-api@main/";
const HUB    = BASE + "nikehub.txt";              // step 1: the hub
const SEVER  = BASE + "sever.txt";               // step 2: the server code

// Integrity check: the loader refuses any file whose SHA-256 doesn't match.
// If you edit a file, the error screen shows its new hash. Paste it here.
// Set to "" to turn the check off for that file.
const HUB_SHA256   = "b8c7a2214c9ca46bdc61feb5dbe4f30351d78f372843f719c6feaec3578dab2f";
const SEVER_SHA256 = "71f713cf80ff0476b2d2133e7641c70a4c777d2056996d0e46326aa8682880ff";
// =======================================================

const statusEl = document.getElementById("status");
const say = m => { statusEl.textContent = m; };
const get = async url => {
  const r = await fetch(url + "?t=" + Date.now());
  if (!r.ok) throw new Error(url.split("/").pop() + " -> HTTP " + r.status);
  return r.text();
};

async function sha256(text) {
  if (!(window.crypto && crypto.subtle)) throw new Error("Browser can't verify files (no crypto.subtle)");
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function getVerified(url, expected) {
  const text = await get(url);
  if (!expected) return text;
  const actual = await sha256(text);
  if (actual !== expected) {
    throw new Error(url.split("/").pop() + " doesn't match the expected hash and was NOT loaded.\n" +
      "Someone may have changed it, or you edited it and need to update the hash.\n" +
      "Its hash is:\n" + actual);
  }
  return text;
}

// Code that runs inside the hub page once it has loaded (step 2)
function buildSeverRunner(severSrc) {
  const runner = `
(function () {
  try {
    var panel = document.createElement("div");
    panel.style.cssText = "position:fixed;inset:0;z-index:99999;display:none;overflow:auto;background:rgba(0,0,0,.96);color:#eee;padding:20px;font-family:system-ui,sans-serif";
    var close = document.createElement("button");
    close.textContent = "✕ close";
    close.style.cssText = "position:sticky;top:0;margin-bottom:12px;padding:6px 12px;cursor:pointer";
    close.onclick = function () { panel.style.display = "none"; };
    var side = document.createElement("div"); side.id = "sidebar";
    side.style.cssText = "display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px";
    var cont = document.createElement("div"); cont.id = "sections-container";
    panel.append(close, side, cont);
    document.body.appendChild(panel);

    var btn = document.createElement("button");
    btn.textContent = "A–Z";
    btn.title = "Server game list";
    btn.style.cssText = "position:fixed;right:14px;bottom:14px;z-index:99998;padding:8px 12px;cursor:pointer;border-radius:8px";
    btn.onclick = function () { panel.style.display = "block"; };
    document.body.appendChild(btn);

    new Function(${JSON.stringify(severSrc).replace(/</g, "\\u003c")})();
  } catch (e) { console.warn("sever.txt failed:", e); }
})();`;
  return "<script>" + runner.replace(/<\/script/gi, "<\\/script") + "<\/script>";
}

(async () => {
  try {
    say("Loading nikehub350...");
    let html = await getVerified(HUB, HUB_SHA256);

    let severTag = "";
    try {
      say("Loading nikehub350...\nLoading sever.txt...");
      severTag = buildSeverRunner(await getVerified(SEVER, SEVER_SHA256));
    } catch (e) {
      if (/hash/.test(e.message)) throw e;       // tampered file: stop
      console.warn("sever.txt not loaded:", e);  // missing file: hub still opens without it
    }

    // Put the sever code at the end of the hub page so it runs after the hub
    const i = html.lastIndexOf("</body>");
    html = i >= 0 ? html.slice(0, i) + severTag + html.slice(i) : html + severTag;

    location.replace(URL.createObjectURL(new Blob([html], { type: "text/html" })));
  } catch (err) {
    say("✗ " + err.message + "\n\nCheck that the file is uploaded to your repo with that exact name.");
  }
})();
</script>
</body>
</html>
